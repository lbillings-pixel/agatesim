version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint 8.x supports TypeScript < 6.1; lift once it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
