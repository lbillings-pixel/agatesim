# Moss agate in 3D with its dendrites seeded 1 mm apart instead of 4 (ADR 0058):
# neighbouring trees compete for particles, the setting of Hou et al.'s length
# law. In a closed nodule the cavity caps the longest trees, so the law comes out
# steeper (alpha about 1.7) than from a fracture surface (1.25).
#
# As moss-3d: a dendrite stage grows
# branched inclusions from scattered points on the wall by 3D aggregation of
# diffusing particles (Hou et al. 2023), then faintly banded chalcedony encloses
# them (ADR 0025).
name = "moss-dense-3d"
seed = 10
archetype = "moss"

[solid]
preset = "nodule-round"
size_mm = 40

[model]
kind = "procedural-growth"
growth_mm = 30
band_period = 0.03
opacity_contrast = 0.25
dendrite_spacing_mm = 1
dendrite_density = 0.04
dendrite_amount = 0.08
dendrite_sticking = 0.5
dendrite_tint = 0.0

[model.schedules.dendrite]
base = 1.0
events = [{ type = "step", at = 0.25, value = 0.0 }]

[model.schedules.iron]
base = 0.05
