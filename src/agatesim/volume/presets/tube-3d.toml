# Tube agate in 3D (procedural tier): four filaments hang from the roof of a
# nodule, as pseudo-stalactites do (Götze et al. 2020b), and chalcedony lines
# them as it lines the wall. A horizontal cut crosses them, showing each as a
# ring system; a vertical cut runs along them (ADR 0025).
name = "tube-3d"
seed = 9
archetype = "tube"

[solid]
preset = "nodule-round"
size_mm = 40
filaments = [
  { start_mm = [-6, 5, 20], end_mm = [-6, 5, -10], radius_mm = 0.4 },
  { start_mm = [7, 8, 20], end_mm = [7, 8, -8], radius_mm = 0.3 },
  { start_mm = [2, -6, 20], end_mm = [2, -6, -12], radius_mm = 0.5 },
  { start_mm = [-9, -7, 20], end_mm = [-9, -7, -6], radius_mm = 0.3 },
]

[slice]  # across the filaments
tilt_deg = 0

[model]
kind = "procedural-growth"
growth_mm = 30
band_period = 0.015

[model.schedules.iron]
base = 0.3
