# The archetype ladder. Single source of truth for which agate forms the
# simulator targets, in what order, and how each will be judged.
#
# Rules (enforced by agatesim.archetypes.registry):
#   - ids are lowercase slugs and unique
#   - an archetype may depend only on archetypes on strictly earlier rungs
#   - status is tracked per model tier (procedural, mechanistic); ADR 0005
#   - "verified" at a tier requires every dependency verified at that tier,
#     and every criterion to have a threshold (min and/or max)
#
# Metrics are provisional until an archetype is implemented, when they gain
# thresholds. Changing a verified archetype's criteria requires an ADR
# (see docs/adr/0004-archetype-ladder.md).
#
# After editing, regenerate the docs: agatesim archetypes --write docs/archetypes.md

schema_version = 2

[[archetypes]]
id = "fortification"
name = "Fortification (concentric) banding"
rung = 1
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
summary = """
Bands that follow the cavity wall inward, layer after layer, keeping the wall's
corners as sharp angular turns. The basic agate form, and the foundation most
other archetypes build on.
"""

  [[archetypes.criteria]]
  id = "wall-parallel"
  description = "Bands run parallel to the cavity wall."
  metric = "Mean |cos θ| between band-boundary normals and the distance-to-wall gradient."
  min = 0.9

  [[archetypes.criteria]]
  id = "corners-preserved"
  description = "Angular turns in the wall propagate inward as angular turns in the bands."
  metric = "Worst, over wall corners, of the median turn width / band spacing for bands near the corner. Turn width is the lateral distance over which a band's direction swings through the middle half of its turn at the corner: where the bisector crosses the band, or at the band's own corner within 4 band spacings of it if that is sharper (ADR 0022). Needs bands at least 5 px apart."
  max = 0.7

  [[archetypes.criteria]]
  id = "closed-bands"
  description = "Bands form closed loops around the cavity centre."
  metric = "Fraction of bands (excluding the innermost) that are one connected ring separating inside from outside."
  min = 0.9

  [[archetypes.criteria]]
  id = "band-count"
  description = "Enough distinct bands to read as banding."
  metric = "Number of distinct bands present."
  min = 8

[[archetypes]]
id = "seam"
name = "Vein / seam agate"
rung = 2
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["seam"]
depends_on = ["fortification"]
summary = """
Banding in an elongated crack, growing inward from both walls toward a central
suture, open void, or quartz infill.
"""

  [[archetypes.criteria]]
  id = "elongate-host"
  description = "The cavity is a high-aspect-ratio crack."
  metric = "Ratio of the cavity's standard deviations along its long and short axes."
  min = 5

  [[archetypes.criteria]]
  id = "mirror-symmetry"
  description = "Band sequences on opposite walls mirror each other about the seam's midline."
  metric = "Minimum correlation between each cross-section's band profile and its reflection, over 7 sections across the middle half of the seam."
  min = 0.8

  [[archetypes.criteria]]
  id = "central-suture"
  description = "Growth fronts from the two walls meet at, or leave open, a central plane."
  metric = "Worst offset of the last-deposited material (or void) from each cross-section's midpoint, as a fraction of its width."
  max = 0.1

[[archetypes]]
id = "waterline"
name = "Waterline (Uruguay-type) horizontal banding"
rung = 3
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
summary = """
Flat, parallel bands lying perpendicular to gravity at the cavity floor. They
record which way was "up" at the time they formed (a geopetal indicator).
"""

  [[archetypes.criteria]]
  id = "gravity-normal"
  description = "Band normals align with the configured gravity vector."
  metric = "Mean |cos θ| between band-boundary normals and gravity."
  min = 0.95

  [[archetypes.criteria]]
  id = "planar"
  description = "Bands are flat, not curved to the wall."
  metric = "Worst RMS residual of a straight-line fit to any band boundary, as a fraction of cavity size."
  max = 0.005

  [[archetypes.criteria]]
  id = "floor-confined"
  description = "Horizontal bands occupy the gravitational bottom of the cavity."
  metric = "Offset of the banded fill's centroid below the cavity centroid along gravity, as a fraction of cavity size."
  min = 0.05

  [[archetypes.criteria]]
  id = "geopetal-recoverable"
  description = "The gravity direction can be recovered from the result alone."
  metric = "Angle (degrees) between true gravity and 'down' estimated from band orientation and which side the open space is on, without using gravity or deposition order."
  max = 3

[[archetypes]]
id = "fortification-waterline"
name = "Combined fortification and waterline banding"
rung = 4
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification", "waterline"]
summary = """
Wall-parallel and horizontal banding in one nodule, produced by changing
conditions over time. The order of the two stages is set by the run's schedule,
since nature records both sequences.
"""

  [[archetypes.criteria]]
  id = "two-domains"
  description = "Distinct wall-parallel and horizontal band domains coexist."
  metric = "Bands in the smaller domain. A band is horizontal if its boundary is straight (RMS < 0.5% of cavity size) and perpendicular to gravity (mean |cos| > 0.95); wall-parallel if clearly curved (RMS > 1%) and not level overall (mean |cos| < 0.9)."
  min = 3

  [[archetypes.criteria]]
  id = "staged"
  description = "The domains form in a few uninterrupted stages, not interleaved band by band."
  metric = "Number of uninterrupted runs of one domain, in deposition order (e.g. wall → horizontal → wall is 3). Whether the stage order matches the schedule is checked in tests."
  max = 4

[[archetypes]]
id = "quartz-geode"
name = "Banded agate with quartz-crystal centre"
rung = 5
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification"]
summary = """
Chalcedony banding at the rim gives way to coarse, inward-pointing quartz crystals
toward the centre (and sometimes an open void) as silica supply falls.
"""

  [[archetypes.criteria]]
  id = "phase-transition"
  description = "Chalcedony lines the wall and macrocrystalline quartz grows inside it."
  metric = "Fraction of quartz pixels not touching the host rock (0 if either phase is missing)."
  min = 0.99

  [[archetypes.criteria]]
  id = "inward-coarsening"
  description = "Crystal size increases toward the centre."
  metric = "Spearman correlation between depth into the quartz and the mean crystal width along curves of equal wall distance (curve length over crystals crossed), at 10 depths over the outer 80% of the quartz layer (needs at least 8 crystals). Fewer, wider crystals inward survives any cut; ADR 0024."
  min = 0.5

  [[archetypes.criteria]]
  id = "quartz-last"
  description = "Quartz formed after the chalcedony banding."
  metric = "Fraction of quartz deposited no earlier than the last chalcedony. That the transition follows the silica-supply schedule is checked in tests."
  min = 0.95

[[archetypes]]
id = "botryoidal"
name = "Botryoidal habit"
rung = 6
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary", "seam"]
depends_on = ["fortification"]
summary = """
Grape-like clusters of hemispherical lobes on the growth surface, formed by
spherulitic growth from many nucleation sites. Bands follow the lobes.
"""

  [[archetypes.criteria]]
  id = "lobate-front"
  description = "The final growth surface is made of rounded lobes."
  metric = "Fraction of the banding next to the open space whose deposition-time surfaces bulge into it, curving about a centre behind them (radius under 30% of cavity size). Needs open space."
  min = 0.6

  [[archetypes.criteria]]
  id = "lobe-count"
  description = "Many lobes, not a single bulge."
  metric = "Number of distinct growth centres behind the final growth surface (peaks in the density of curvature centres, each holding at least 1% of the surface pixels). That lobe count rises with nucleation density is checked in tests."
  min = 5

  [[archetypes.criteria]]
  id = "bands-follow-lobes"
  description = "Internal bands are concentric about the lobes, not parallel to the wall."
  metric = "Fraction of band-boundary pixels whose band curves about a centre behind it."
  min = 0.7

[[archetypes]]
id = "eye"
name = "Eye agate"
rung = 7
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["botryoidal"]
summary = """
Isolated, concentrically banded "eyes": spherulites nucleated at the wall. In a
cross-section they appear as half-ring systems rooted on the wall, overgrown by
later banding; on a surface ground parallel to the wall they appear as circles.
"""

  [[archetypes.criteria]]
  id = "discrete-eyes"
  description = "Several separate band systems radiate from their own centres."
  metric = "Number of distinct growth centres of the banding (peaks in the density of band-boundary curvature centres, each holding at least 1% of band-boundary pixels)."
  min = 3

  [[archetypes.criteria]]
  id = "wall-nucleated"
  description = "Eyes are rooted at the cavity wall."
  metric = "Fraction of growth centres that are eyes rooted at the wall: within 3% of cavity size of the original wall (a cut through the nucleation sites); or off it with no seed nearby and either rings closed around at least 75% of directions (a cut along the wall, showing a bullseye; ADR 0024) or arcs centred within 0.75 of their curvature radius from the wall (a cut through the side of an eye's dome; ADR 0031). Rings around a seed are tubes."
  min = 0.8

  [[archetypes.criteria]]
  id = "isolated-eyes"
  description = "The eyes are separate, not a continuous botryoidal crust."
  metric = "Fraction of the first banding on the wall that is ordinary layering rather than radiating from a centre."
  min = 0.3

[[archetypes]]
id = "tube"
name = "Tube agate"
rung = 8
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["eye"]
summary = """
Chalcedony banding grown around thin linear seeds (needles, filaments, stalactitic
channels). In cross-section each tube shows up as a small concentric ring system.
"""

  [[archetypes.criteria]]
  id = "seed-concentric"
  description = "Bands around each seed are circles about it."
  metric = "Worst seed's fraction of band boundary in its ring zone (out to halfway to the nearest other solid) lying within 10% of that band's median distance from the seed."
  min = 0.8

  [[archetypes.criteria]]
  id = "seed-placement"
  description = "Ring systems sit where the seeds are."
  metric = "Worst seed's offset from the centre of its ring system (median of circle fits to its band boundaries), as a fraction of the ring zone's radius."
  max = 0.1

[[archetypes]]
id = "moss"
name = "Moss / dendritic agate"
rung = 9
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary", "seam"]
summary = """
Branching, tree-like inclusions in translucent chalcedony. Two kinds share the
name: dendrites of Mn or Fe oxides (grown by aggregation of diffusing
particles, or as fingers of infiltrating fluid) and green filamentous fabrics
with Fe-silicate cores wrapped in chalcedony.
"""

  [[archetypes.criteria]]
  id = "fractal-dimension"
  description = "Inclusions are branched, like natural dendrites."
  metric = "Area-weighted mean box-counting dimension of each inclusion at least 2 mm across, measured on its own between 0.4 mm (or 2 px) and half its extent (a line is 1, a solid patch 2; large DLA clusters approach 1.7, smaller ones measure lower)."
  min = 1.3
  max = 1.9

  [[archetypes.criteria]]
  id = "translucent-matrix"
  description = "Dendrites sit in a mostly clear host, not a mass of inclusions."
  metric = "Share of the cavity occupied by inclusions."
  max = 0.2

[[archetypes]]
id = "plume"
name = "Plume agate"
rung = 10
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["moss"]
summary = """
Feathery, upward-billowing inclusions rising from a base and later enclosed by
chalcedony; interpreted as silica-garden self-assembly driven by osmosis,
reaction and buoyancy.
"""

  [[archetypes.criteria]]
  id = "anisotropic-growth"
  description = "Plumes grow upward from their base."
  metric = "Mean cos² between the local branch direction of the inclusions (structure tensor over 0.4 mm, weighted by coherence) and gravity: 1 = all vertical, about 0.5 = pointing every way."
  min = 0.7

  [[archetypes.criteria]]
  id = "encapsulated"
  description = "Plumes are enclosed by later chalcedony."
  metric = "Share of inclusion pixels with no open space within 2 px."
  min = 0.98

[[archetypes]]
id = "shadow"
name = "Shadow agate"
rung = 11
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "optics"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification"]
summary = """
An optical effect: alternating translucent and opaque bands make shadows appear
to sweep across a slab as it is tilted or the light moves. Needs the optical
renderer, not just the formation model.
"""

  [[archetypes.criteria]]
  id = "alternating-translucency"
  description = "The banding alternates between translucent and opaque layers."
  metric = "Mean change in translucency between consecutive bands, in deposition order (0 = uniform, 1 = strict clear/milky alternation)."
  min = 0.6

  [[archetypes.criteria]]
  id = "angle-dependent-shadow"
  description = "The rendered shadow pattern moves with the light angle."
  metric = "How far the shadow inside clear bands (horizontal crossings between milky bands) moves across them, as a fraction of their width, when the light swings between opposite directions (largest swing over ±20° and ±40°); counted only if the shadow is visible (median contrast across the band at least 0.2) and sits on opposite sides for opposite light at every angle."
  min = 0.3

[[archetypes]]
id = "stick"
name = "Stick agate"
rung = 13
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "formation"
hosts = ["volcanic", "seam"]
depends_on = ["tube"]
summary = """
Straight, crystal-shaped rods inside the agate: prisms of an earlier mineral
(probably a zeolite at Ankara-Çubuk) that grew in the cavity before the agate,
were lined by its bands, and were later replaced by silica, keeping their
shape (pseudomorphs), or dissolved, leaving moulds. At Ankara they fill
crevice veins in andesite.
"""

  [[archetypes.criteria]]
  id = "straight-sticks"
  description = "The sticks are straight and crystal-shaped."
  metric = "Share of sticks (patches of quartz, open space or inclusion other than the cavity's centre, at least 0.3 mm²) at least 4 times longer than wide (ratio of principal standard deviations) and filling at least 60% of their oriented bounding box."
  min = 0.75

  [[archetypes.criteria]]
  id = "stick-count"
  description = "There are several sticks."
  metric = "Number of straight, crystal-shaped sticks."
  min = 5

  [[archetypes.criteria]]
  id = "pseudomorph-fill"
  description = "The sticks are pseudomorphs or hollow moulds, not an opaque mineral."
  metric = "Share of the straight sticks' area that is quartz or open space."
  min = 0.9

  [[archetypes.criteria]]
  id = "bands-wrap-sticks"
  description = "The bands wrap the sticks."
  metric = "Worst straight stick's share of nearby band boundary (at most half as far from the stick as from any other solid) lying within 15% of that band's median distance from the stick."
  min = 0.7

[[archetypes]]
id = "iris"
name = "Iris agate"
rung = 12
status = { procedural = "verified", mechanistic = "verified" }
subsystem = "optics"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification"]
summary = """
Rainbow colours in thin, backlit slices, caused by very fine banding acting as a
diffraction grating. Needs wave-optics rendering.
"""

  [[archetypes.criteria]]
  id = "grating-spacing"
  description = "Band spacing is fine enough to diffract visible light."
  metric = "Median micro-band spacing (µm) where regular micro-banding is visible (pigment < 0.3, translucency > 0.4); measured iris gratings run from about 1.7 to 64 µm (Jones 1952; ADR 0042)."
  min = 1
  max = 65

  [[archetypes.criteria]]
  id = "spectral-dispersion"
  description = "Transmitted light separates into colours at angles the grating equation predicts."
  metric = "Median difference (nm) between the wavelength of the rendered colour (from its hue) and the first order predicted by d·sin θ = λ, over pixels where that prediction is 450–630 nm, at views of 12°, 16° and 20°."
  max = 15
