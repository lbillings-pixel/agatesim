# The archetype ladder. Single source of truth for which agate forms the
# simulator targets, in what order, and how each will be judged.
#
# Rules (enforced by agatesim.archetypes.registry):
#   - ids are lowercase slugs and unique
#   - an archetype may depend only on archetypes on strictly earlier rungs
#   - status is tracked per model tier (procedural, mechanistic); ADR 0005
#   - "verified" at a tier requires every dependency verified at that tier,
#     and every criterion to have a threshold (min and/or max)
#
# Metrics are provisional until an archetype is implemented, when they gain
# thresholds. Changing a verified archetype's criteria requires an ADR
# (see docs/adr/0004-archetype-ladder.md).
#
# After editing, regenerate the docs: agatesim archetypes --write docs/archetypes.md

schema_version = 2

[[archetypes]]
id = "fortification"
name = "Fortification (concentric) banding"
rung = 1
status = { procedural = "verified", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
summary = """
Bands that follow the cavity wall inward, layer after layer, keeping the wall's
corners as sharp angular turns. The basic agate form, and the foundation most
other archetypes build on.
"""

  [[archetypes.criteria]]
  id = "wall-parallel"
  description = "Bands run parallel to the cavity wall."
  metric = "Mean |cos θ| between band-boundary normals and the distance-to-wall gradient."
  min = 0.9

  [[archetypes.criteria]]
  id = "corners-preserved"
  description = "Angular turns in the wall propagate inward as angular turns in the bands."
  metric = "Worst, over wall corners, of the median turn width / band spacing for bands near the corner. Turn width is the lateral distance over which a band's direction swings through the middle half of its turn at the corner. Needs bands at least 5 px apart."
  max = 0.7

  [[archetypes.criteria]]
  id = "closed-bands"
  description = "Bands form closed loops around the cavity centre."
  metric = "Fraction of bands (excluding the innermost) that are one connected ring separating inside from outside."
  min = 0.9

  [[archetypes.criteria]]
  id = "band-count"
  description = "Enough distinct bands to read as banding."
  metric = "Number of distinct bands present."
  min = 8

[[archetypes]]
id = "seam"
name = "Vein / seam agate"
rung = 2
status = { procedural = "verified", mechanistic = "pending" }
subsystem = "formation"
hosts = ["seam"]
depends_on = ["fortification"]
summary = """
Banding in an elongated crack, growing inward from both walls toward a central
suture, open void, or quartz infill.
"""

  [[archetypes.criteria]]
  id = "elongate-host"
  description = "The cavity is a high-aspect-ratio crack."
  metric = "Ratio of the cavity's standard deviations along its long and short axes."
  min = 5

  [[archetypes.criteria]]
  id = "mirror-symmetry"
  description = "Band sequences on opposite walls mirror each other about the seam's midline."
  metric = "Minimum correlation between each cross-section's band profile and its reflection, over 7 sections across the middle half of the seam."
  min = 0.8

  [[archetypes.criteria]]
  id = "central-suture"
  description = "Growth fronts from the two walls meet at, or leave open, a central plane."
  metric = "Worst offset of the last-deposited material (or void) from each cross-section's midpoint, as a fraction of its width."
  max = 0.1

[[archetypes]]
id = "waterline"
name = "Waterline (Uruguay-type) horizontal banding"
rung = 3
status = { procedural = "verified", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
summary = """
Flat, parallel bands lying perpendicular to gravity at the cavity floor. They
record which way was "up" at the time they formed (a geopetal indicator).
"""

  [[archetypes.criteria]]
  id = "gravity-normal"
  description = "Band normals align with the configured gravity vector."
  metric = "Mean |cos θ| between band-boundary normals and gravity."
  min = 0.95

  [[archetypes.criteria]]
  id = "planar"
  description = "Bands are flat, not curved to the wall."
  metric = "Worst RMS residual of a straight-line fit to any band boundary, as a fraction of cavity size."
  max = 0.005

  [[archetypes.criteria]]
  id = "floor-confined"
  description = "Horizontal bands occupy the gravitational bottom of the cavity."
  metric = "Offset of the banded fill's centroid below the cavity centroid along gravity, as a fraction of cavity size."
  min = 0.05

  [[archetypes.criteria]]
  id = "geopetal-recoverable"
  description = "The gravity direction can be recovered from the result alone."
  metric = "Angle (degrees) between true gravity and 'down' estimated from band orientation and which side the open space is on, without using gravity or deposition order."
  max = 3

[[archetypes]]
id = "fortification-waterline"
name = "Combined fortification and waterline banding"
rung = 4
status = { procedural = "verified", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification", "waterline"]
summary = """
Wall-parallel and horizontal banding in one nodule, produced by changing
conditions over time. The order of the two stages is set by the run's schedule,
since nature records both sequences.
"""

  [[archetypes.criteria]]
  id = "two-domains"
  description = "Distinct wall-parallel and horizontal band domains coexist."
  metric = "Bands in the smaller domain. A band is horizontal if its boundary is straight (RMS < 0.5% of cavity size) and perpendicular to gravity (mean |cos| > 0.95); wall-parallel if clearly curved (RMS > 1%) and not level overall (mean |cos| < 0.9)."
  min = 3

  [[archetypes.criteria]]
  id = "staged"
  description = "The domains form in a few uninterrupted stages, not interleaved band by band."
  metric = "Number of uninterrupted runs of one domain, in deposition order (e.g. wall → horizontal → wall is 3). Whether the stage order matches the schedule is checked in tests."
  max = 4

[[archetypes]]
id = "quartz-geode"
name = "Banded agate with quartz-crystal centre"
rung = 5
status = { procedural = "verified", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification"]
summary = """
Chalcedony banding at the rim gives way to coarse, inward-pointing quartz crystals
toward the centre (and sometimes an open void) as silica supply falls.
"""

  [[archetypes.criteria]]
  id = "phase-transition"
  description = "Chalcedony lines the wall and macrocrystalline quartz grows inside it."
  metric = "Fraction of quartz pixels not touching the host rock (0 if either phase is missing)."
  min = 0.99

  [[archetypes.criteria]]
  id = "inward-coarsening"
  description = "Crystal size increases toward the centre."
  metric = "Spearman correlation between each crystal's mean distance from the wall and its size (needs at least 8 crystals)."
  min = 0.5

  [[archetypes.criteria]]
  id = "quartz-last"
  description = "Quartz formed after the chalcedony banding."
  metric = "Fraction of quartz deposited no earlier than the last chalcedony. That the transition follows the silica-supply schedule is checked in tests."
  min = 0.95

[[archetypes]]
id = "botryoidal"
name = "Botryoidal habit"
rung = 6
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary", "seam"]
depends_on = ["fortification"]
summary = """
Grape-like clusters of hemispherical lobes on the growth surface, formed by
spherulitic growth from many nucleation sites. Bands follow the lobes.
"""

  [[archetypes.criteria]]
  id = "lobate-front"
  description = "The final growth surface is made of rounded lobes."
  metric = "Front curvature is mostly positive, with lobe radii in a configured range."

  [[archetypes.criteria]]
  id = "bands-follow-lobes"
  description = "Internal bands are concentric about lobe centres."
  metric = "Band contours fit circles about nucleation sites with residual ≤ threshold."

  [[archetypes.criteria]]
  id = "nucleation-controlled"
  description = "Nucleation density controls lobe size."
  metric = "Mean lobe radius decreases as nucleation-site density increases."

[[archetypes]]
id = "eye"
name = "Eye agate"
rung = 7
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["botryoidal"]
summary = """
Isolated, circular, concentrically banded "eyes": spherulites nucleated at the
wall, seen on a cut or weathered surface.
"""

  [[archetypes.criteria]]
  id = "discrete-eyes"
  description = "Separate circular band systems are present."
  metric = "Count of concentric systems within a configured range, each with circularity ≥ threshold."

  [[archetypes.criteria]]
  id = "wall-nucleated"
  description = "Eyes are rooted at the cavity wall."
  metric = "Each eye's centre lies within a tolerance of the original wall."

[[archetypes]]
id = "tube"
name = "Tube agate"
rung = 8
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["eye"]
summary = """
Chalcedony banding grown around thin linear seeds (needles, filaments, stalactitic
channels). In cross-section each tube shows up as a small concentric ring system.
"""

  [[archetypes.criteria]]
  id = "seed-concentric"
  description = "Bands are concentric about the configured seeds."
  metric = "Band contours around each seed fit circles with residual ≤ threshold."

  [[archetypes.criteria]]
  id = "seed-placement"
  description = "Ring systems sit where the seeds were placed."
  metric = "Ring-system centres match seed positions within tolerance."

[[archetypes]]
id = "moss"
name = "Moss / dendritic agate"
rung = 9
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary", "seam"]
summary = """
Branching, tree-like inclusions of iron or manganese oxides in translucent
chalcedony, grown by diffusion-limited branching.
"""

  [[archetypes.criteria]]
  id = "fractal-dimension"
  description = "Inclusions are branched, like natural dendrites."
  metric = "Box-counting dimension of the inclusion mask in a configured range (DLA ≈ 1.7 in 2D)."

  [[archetypes.criteria]]
  id = "translucent-matrix"
  description = "Dendrites sit in a mostly translucent host."
  metric = "Inclusion area fraction ≤ threshold."

[[archetypes]]
id = "plume"
name = "Plume agate"
rung = 10
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "formation"
hosts = ["volcanic", "sedimentary"]
depends_on = ["moss"]
summary = """
Feathery, upward-billowing oxide inclusions rising from a base, later enclosed by
chalcedony.
"""

  [[archetypes.criteria]]
  id = "anisotropic-growth"
  description = "Plumes grow preferentially in one direction from a base."
  metric = "Principal-axis anisotropy of each plume mask ≥ threshold."

  [[archetypes.criteria]]
  id = "encapsulated"
  description = "Plumes are enclosed by later chalcedony."
  metric = "Every plume pixel is surrounded by chalcedony phase within a buffer distance."

[[archetypes]]
id = "shadow"
name = "Shadow agate"
rung = 11
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "optics"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification"]
summary = """
An optical effect: alternating translucent and opaque bands make shadows appear
to sweep across a slab as it is tilted or the light moves. Needs the optical
renderer, not just the formation model.
"""

  [[archetypes.criteria]]
  id = "alternating-translucency"
  description = "The banding alternates between translucent and opaque layers."
  metric = "Translucency profile across the bands shows alternation contrast ≥ threshold."

  [[archetypes.criteria]]
  id = "angle-dependent-shadow"
  description = "The rendered shadow pattern moves with light or view angle."
  metric = "Displacement of the rendered shadow pattern correlates with angle change (|r| ≥ threshold)."

[[archetypes]]
id = "iris"
name = "Iris agate"
rung = 12
status = { procedural = "pending", mechanistic = "pending" }
subsystem = "optics"
hosts = ["volcanic", "sedimentary"]
depends_on = ["fortification", "shadow"]
summary = """
Rainbow colours in thin, backlit slices, caused by very fine banding acting as a
diffraction grating. Needs wave-optics rendering.
"""

  [[archetypes.criteria]]
  id = "grating-spacing"
  description = "Band spacing is fine enough to diffract visible light."
  metric = "Band spacing in a configured micrometre-scale range."

  [[archetypes.criteria]]
  id = "spectral-dispersion"
  description = "Transmitted light separates into colours at angles the grating equation predicts."
  metric = "Rendered diffraction angles match d·sin θ = mλ within tolerance."
