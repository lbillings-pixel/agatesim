# Verification preset for stick agate (mechanistic tier): blade-shaped crystals
# nucleate on the wall and grow with a needle habit, competing by geometric
# selection; front-feedback (H1) chalcedony then lines them as it lines the
# wall; at the end they are replaced by quartz (ADR 0049). The stage order and
# the replacement are scheduled changes of conditions.
# In a crevice vein, as the Ankara stick agates are in andesite (Hatipoglu and
# Dora 2000; ADR 0049 amendment).
name = "stick-mechanistic"
seed = 13
archetype = "stick"

[grid]
resolution = 768

[cavity]
preset = "seam-straight"
size_mm = 120

[model]
kind = "mechanistic-staged"
order = "stick-wall"

[model.stick]
spacing_mm = 4.5
length_mm = 5
elongation = 12
