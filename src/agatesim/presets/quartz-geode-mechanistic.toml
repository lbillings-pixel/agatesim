# Verification preset for the quartz-centre geode (mechanistic tier): front
# feedback (H1) bands while the cavity is resupplied; once 0.6 of it has
# filled, the cavity closes (a scheduled change of conditions, ADR 0046) and the
# trapped fluid's silica runs down. Below the quartz threshold, quartz crystals
# nucleate on the chalcedony and coarsen inward by geometric selection, until
# the silica runs out and leaves an open centre (ADR 0037).
name = "quartz-geode-mechanistic"
seed = 6
archetype = "quartz-geode"

[grid]
resolution = 768

[cavity]
preset = "vesicle-almond"
size_mm = 60

[model]
kind = "mechanistic-front-feedback"
silica_inventory = 0.8
quartz_below = 0.8
closes_at = 0.6
