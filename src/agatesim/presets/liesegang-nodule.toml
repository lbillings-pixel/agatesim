# Exploration preset for H2 (Liesegang precipitation) in an angular nodule:
# closed, wall-parallel rings that round off the corners and break into spots
# inward, so H2 fails the fortification corner test (ADR 0015). Needs the GPU
# backend to run quickly (used when found; about 15 s); on the CPU it takes hours.
name = "liesegang-nodule"
seed = 1
archetype = "fortification"

[grid]
resolution = 768

[cavity]
preset = "nodule-angular"
size_mm = 50

[model]
kind = "mechanistic-liesegang"
# The spacing this preset was tuned on (it asked 0.05, which was 4% coarser until
# ADR 0084). At 0.049-0.051 its outer bands fall under 5 px apart at 768 px, too
# close for the corner measure to judge.
lattice_mm = 0.052
