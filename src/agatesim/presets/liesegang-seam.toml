# Exploration preset for H2 (Liesegang precipitation) in a seam: mirror-image
# bands meeting at the midline, passing the seam criteria (ADR 0015). GPU
# recommended (used when found; a few seconds).
name = "liesegang-seam"
seed = 2
archetype = "seam"

[grid]
resolution = 768

[cavity]
preset = "seam-straight"
size_mm = 30
rotation_deg = 20

[model]
kind = "mechanistic-liesegang"
lattice_mm = 0.02
