# Verification preset for eye agate (procedural tier): a brief spherulitic stage
# grows a few widely spaced hemispherical eyes on the wall, then uniform layers
# overgrow them, carrying their curvature inward.
name = "eye"
seed = 8
archetype = "eye"

[grid]
resolution = 768

[cavity]
preset = "vesicle-round"
size_mm = 50

[model]
kind = "procedural-growth"
growth_mm = 22
band_period = 0.02
spherulite_spacing_mm = 20
spherulite_rate_variability = 0.1

[model.schedules.spherulitic]
base = 1.0
events = [{ type = "step", at = 0.15, value = 0.0 }]

[model.schedules.iron]
base = 0.3
