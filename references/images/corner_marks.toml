# Hand-marked corners on the high-resolution reference photos (ADR 0029).
#
# The photos themselves are fetched on demand (scripts/fetch_reference_images.py)
# into references/images/full/, which is gitignored; these marks are what makes
# the measurements repeatable. Coordinates are full-resolution pixels (x right,
# y down), marked by eye on gridded crops.
#
# Each [[marker]] is a band that rings the polygon and is picked out by colour
# (hue in degrees, minimum saturation and value, all 0-1 except hue). Its
# `vertices` are corners of the band's centreline, in order around the polygon;
# each consecutive pair is a face. `reach_px` is how far either side of a face
# line the band is looked for.

[[marker]]
photo = "polyhedral-agate-caillois-donation-mnhn-n02.jpg"
band = "the orange band ringing the inner, yellow-banded polygon"
hue_deg = [10.0, 32.0]
min_saturation = 0.6
min_value = 0.35
reach_px = 300
vertices = [[2140, 1500], [3070, 1230], [3480, 2730], [3620, 4000], [1560, 4010]]
faces = ["top", "right, upper", "right, lower", "bottom", "left"]
notes = "The right face has a gentle bend (about 165 degrees) at the third vertex, so it is measured as two faces. Dark cracks cross the band on the left face."

[[marker]]
photo = "polyhedral-agate-caillois-donation-mnhn-n04.jpg"
band = "the inner orange band ringing the white quartz centre"
hue_deg = [10.0, 32.0]
min_saturation = 0.6
min_value = 0.35
reach_px = 200
vertices = [[2675, 950], [6550, 2650], [1325, 2725], [800, 2325]]
faces = ["top-right", "bottom", "short left face", "top-left"]
notes = "The ring is open at the acute right tip, where the band also splits in two for the last tenth of the top-right face."
