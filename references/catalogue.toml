topics = ["chalcedony-growth", "fibers", "moganite", "low-temperature"]
notes = "Read in full 2026-10-26 (PDF the owner supplied; ADR 0072): argues against a gel precursor (Liesegang banding 'extremely rare in agates'; opal-A and opal-CT 'not observed in radially fibrous chalcedony'; p.68) and for direct precipitation 'from a non-viscous mother fluid' of partly polymerised silica. Rapid crystallisation and impurities raise Brazil-twin density; moganite where twinning is continuous (pp.70–72). Rejects Al-induced twisting: 'no apparent structural foundation' (p.70). The quartz centre switch is 'nearly always extremely abrupt'; repeated chalcedony–quartz sequences mean 'successive infiltrations' (p.72). Horizontal onyx is equigranular microquartz from 'quiescent and highly concentrated' later fluids (p.72). Abstract:Fibres grow by spiral growth on a screw dislocation from short-chain silica polymers; explains [110] elongation, periodic fibre twisting, Brazil twins and moganite intergrowths. Supports precipitation from slightly saturated solutions below about 100 °C. As summarised by moxon2020 (§2.4): chalcedony forms from weakly polymerised silica, leaving dilute monomeric silicic acid from which prismatic quartz grows last."

