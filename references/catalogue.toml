[[references]]
id = "goetze2020"
kind = "review"
authors = ["Götze, J.", "Möckel, R.", "Pan, Y."]
year = 2020
title = "Mineralogy, Geochemistry and Genesis of Agate—A Review"
venue = "Minerals 10(11), 1037"
doi = "10.3390/min10111037"
access = "open"
licence = "CC-BY-4.0"
checked = "sections"
sections_read = ["1", "3", "4.1", "4.2.1", "5.4", "5.5", "6"]
topics = ["mineralogy", "geochemistry", "genesis", "formation-temperature", "host-rocks", "quartz-transition", "spherulites", "moss", "plume", "tubes"]
notes = """Primary overview, read 2026-10-15. Key points: crystallisation often starts with spherulitic chalcedony at the wall that continues into fibrous chalcedony (§4.1.2, §5.4, Fig. 29); wall-lining agates have three zones, spherulitic/granular rim, fibrous chalcedony, macrocrystalline quartz centre (§4.1.2); "Macrocrystalline quartz crystallizes when the SiO2 concentration in the mineralizing fluid is low" (§6), with a drop in impurities and defects at the chalcedony–quartz interface (§5.4); Uruguay bands from gravitational sedimentation of sols with flocculated silica particles, needing high silica concentration (§4.1.2); iron pigments are rejected by crystallising quartz and accumulate along the banding (§5.4); visible bands can contain up to 1000 micro-bands per mm (§4.1.2); colour banding governed by self-organisation of the silica matrix rather than Liesegang diffusion (§5.4); "infiltration channels"/"escape tubes" mostly deformation of plastic silica (§5.5); stalactitic SFF and moss agate filaments have Fe-silicate/zeolite cores with concentric chalcedony and possible biosignatures (§5.5); plume agate interpreted as silica-garden self-assembly from osmosis, reaction and buoyancy (§5.5)."""

[[references]]
id = "moxon2020"
kind = "review"
authors = ["Moxon, T.", "Palyanova, G."]
year = 2020
title = "Agate Genesis: A Continuing Enigma"
venue = "Minerals 10(11), 953"
doi = "10.3390/min10110953"
access = "open"
licence = "CC-BY-4.0"
checked = "sections"
sections_read = ["2.1", "2.2", "2.4 (gel experiments, Heaney model)", "5"]
topics = ["genesis", "history-of-theories", "basic-igneous-hosts", "quartz-transition", "liesegang"]
notes = """History of genesis theories for agate in basic igneous hosts, read in part 2026-10-15. Summary (§5): formation mostly below 100 °C in basic igneous hosts; agate starts as amorphous silica and matures over geological time (moganite slowly converts to quartz, crystallites coarsen); "little support" now for agate formation by metal-ion diffusion into a silica gel. Describes Heaney's mechanism: a weakly polymerised silica solution forms chalcedony and leaves dilute monomeric silicic acid, undersaturated for amorphous silica but saturated for quartz, from which prismatic quartz grows last. Reports gel experiments (Godovikov et al.) in which branched dendrites appear at maximum supersaturation and faceted crystals at minimal supersaturation."""

[[references]]
id = "cartwright2026"
kind = "review"
authors = [
    "Cartwright, J. H. E.", "Cockell, C. S.", "Goehring, L.", "Holler, S.", "Jordan, S. F.",
    "Knoll, P.", "Kotopoulou, E.", "Loron, C. C.", "McMahon, S.", "Morris, S. W.",
    "Neubeck, A.", "Pimentel, C.", "Sainz-Díaz, C. I.", "Shahidzadeh, N.", "Szymczak, P.",
]
year = 2026
title = "Self-Organized Pattern Formation in Geological Soft Matter"
venue = "Physics Reports 1183, 1–98"
url = "https://arxiv.org/abs/2412.18999"
access = "open"
licence = "arXiv non-exclusive distribution licence 1.0 (preprint); publisher terms for the journal version"
checked = "sections"
sections_read = ["5.1.1 Agates"]
topics = ["self-organization", "pattern-formation", "soft-matter", "agate", "iris", "liesegang"]
notes = """Broad framework for geological pattern formation; §5.1.1 reviews agate (read 2026-10-15). Micro-banding of defect-rich chalcedony and macrocrystalline quartz at ~100 µm, with oscillatory zonation of defects at 0.5–5 µm; the change of refractive index along these bands gives iris colours; iris spacing ~2 µm (Fig. 35, after jones1952); 'Zones with iris banding exist in nearly every agate, although they are often concealed by pigmentation.' Growth starts as spherulites at the wall, then common banding equidistant to the walls. Against Liesegang models: no sharp corners, ring defects, Jabłczyński spacing law not seen in agate, gel shrinkage problem. Against external-rhythm models: nearby agates have uncorrelated band sequences. Wang–Merino model: Al3+ accumulating at the front accelerates quartz crystallisation, alternating chalcedony and quartz bands."""

