notes = """Read 2026-10-17 from text extracted locally from the open PDF (searched, not read cover to cover). A dissolving seed is wrapped in a semipermeable precipitation membrane; the osmotic pressure is released by rupture, the membrane heals across the front between the fluids, buoyancy makes the inner solution rise, and the membrane keeps rupturing and re-precipitating at the interface, so the structure extends upward with some sideways deviations. Osmosis and buoyancy drive the flow. With injection, the tube's volume grows at the injection rate, so the vertical growth velocity follows from it; tube radius rises with injection rate; flow up the tube follows Hagen–Poiseuille drag. Natural chemical-garden structures include hydrothermal vents; tubular structures in rocks are read as a slow geological version. No mention of agate found."""

