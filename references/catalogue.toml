notes = """Read 2026-10-17, pp. 578-584 of the scanned PDF (text layers decoded locally). Iris colour is diffraction by a grating whose lines are the edges of thin lamellae of alternately higher and lower refractive index. Observed fineness ranges from about 15,000 to 400 lines per inch (about 1.7-64 µm); the figured specimen has about 10,000 (2.5 µm). The lines are always at right angles to the chalcedony needles and continue across neighbouring crystal groups; iris occurs in colourless, pure, low-porosity chalcedony, often in layers next to the quartz centre and with turtleback (spherulitic) growth, never in opal bands. The thin layers have the higher index and are more quartz-like, which rules out more opal in them (though the abstract suggests opal segregation). The author's opinion: the lines formed while the crystals grew, by rhythmic crystallisation like that of some organic melts, not in the manner of ordinary bands. Pages after 584 not read."""

