notes = "Linear-probe segmentation results read 2026-10-24 (M33): a linear layer on frozen, bilinearly upsampled patch tokens of ViT-S/14 gives mIoU 44.3 on ADE20k and 81.1 on VOC (47.2 and 82.6 with the last four layers, 640 px and multiscale); patches are 14 px. Abstract read 2026-10-24: self-supervised pretraining on a large curated image set gives general-purpose visual features; a 1B-parameter ViT is distilled into smaller models, reported to beat OpenCLIP on most image- and pixel-level benchmarks. The small distilled model (ViT-S/14) is the one used here (ADR 0067)."

