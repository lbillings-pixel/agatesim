topics = ["banding", "self-organization", "oscillatory-zoning", "iris"]
notes = """Read in full 2026-10-26 (PDF the owner supplied; ADR 0072). Ion probe and TEM on four agates. Iris striations 0.1–5 µm apart, cycling '8000 times or more', 'present in virtually all agates' (p.1562). Al and Na co-vary, with slightly higher contents in the defect-rich bands; no H variation detected (pp.1562–63). TEM: ~200 nm banding of 'nearly perfect quartz' L bands (100–1000 nm) and H bands of 5–10 nm crystallites with Brazil twins and moganite, sharing one orientation (p.1563). Defect concentration oscillates at three scales about two orders apart: 0.2 µm, ~700 µm (defect-rich chalcedony vs defect-poor quartz), and cm (chalcedony to drusy quartz) (p.1564). Twist bands do not coincide with iris bands (note 11). Proposed: partly polymerised fluid rapidly precipitates defective chalcedony until silica depletion at fibre tips stops polymerisation; monomeric fluid then grows slow perfect quartz until diffusion restores silica activity (pp.1563–64). The feedback variable is silica polymerisation, with impurities as markers, not drivers."""

