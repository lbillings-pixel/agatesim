notes = "Read in full 2026-10-26 by OCR of the scan the owner supplied (plates not recoverable; ADR 0072). Commercial geode agates from Uruguay, Brazil, Japan and China; only quartz with a little water, no moganite or opal-CT by X-ray (p.55). Optical fibres 1–50 µm wide, each of 10–50 finer fibres, length-fast; crystallites 8–100 nm long (p.56). Iris striations 1–3 µm, grain size and porosity rising within each layer then resetting (p.58). Twisting-like extinction bands read as textural (pores and Fe-rich inclusions), not optical (pp.60–63). Uruguay bands: euhedral grains about 3 µm and spherulites from a few tens to 200 µm, graded coarse at the bottom (pp.66–67, 70, 73). Sequence agate bands, coarse quartz, Uruguay bands 'is always maintained in any geode agates, and never reversed, although it may repeat plural times in one geode' (p.73); a later solution laid agate bands on a settled flat floor (p.67). 'Gravitational precipitation is the most reasonable mechanism' (p.73), of particles that grew in suspension during wall lining. Gel/Liesegang origin rejected. Abstract:Fibres are aligned quartz crystallites 8–100 nm long. Uruguay (horizontal) bands are euhedral quartz grains (0.5–4 µm) and/or spherulites (≤100 µm), deposited by gravity after the agate bands and coarse quartz formed. Proposes growth from a hydrothermal solution carrying ~10 nm polymerized particles."

