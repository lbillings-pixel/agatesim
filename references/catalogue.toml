notes = "Sections read 2026-10-29 by a helper agent (ADR 0074). Promptable segmentation: points, boxes or a low-resolution mask in, three masks out for ambiguous prompts, each with a predicted IoU (Sec. 3, App. A). The data engine kept masks with predicted IoU at least 0.88 and stability at least 0.95, stability being the IoU of the masks thresholded at logits -1 and +1 (Sec. 4, App. B). No calibration study of predicted against true IoU; in aggregate 94% of filtered automatic masks had IoU above 90% with corrected versions (Sec. 5). Limitations: misses fine structures, hallucinates small disconnected pieces, boundaries less crisp than zoom-in methods (Sec. 8). The mask prompt expects SAM's own 256 x 256 logits (predictor docstring)."

