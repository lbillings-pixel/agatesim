topics = ["genesis", "history-of-theories", "basic-igneous-hosts", "quartz-transition", "liesegang"]
notes = """History of genesis theories for agate in basic igneous hosts, read in part 2026-10-15. Summary (§5): formation mostly below 100 °C in basic igneous hosts; agate starts as amorphous silica and matures over geological time (moganite slowly converts to quartz, crystallites coarsen); "little support" now for agate formation by metal-ion diffusion into a silica gel. Describes Heaney's mechanism: a weakly polymerised silica solution forms chalcedony and leaves dilute monomeric silicic acid, undersaturated for amorphous silica but saturated for quartz, from which prismatic quartz grows last. A final quartz deposit gives an impression of a separate entry, which the authors judge not possible (read 2026-10-17). Reports gel experiments (Godovikov et al.) in which branched dendrites appear at maximum supersaturation and faceted crystals at minimal supersaturation."""

